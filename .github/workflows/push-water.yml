name: push-water
# Цаг тутам (UB 07:05–21:05) усны сануулга + Даваа 09:00 UB долоо хоногийн тайлан
on:
  schedule:
    - cron: "5 23,0-13 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/push-water
        env:
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          curl -fsS --retry 2 --max-time 60 -X POST \
            -H "X-Push-Secret: $PUSH_CRON_SECRET" \
            https://eahs.vercel.app/api/push-water
